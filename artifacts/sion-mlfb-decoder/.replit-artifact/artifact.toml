kind = "web"
previewPath = "/"
title = "SION MLFB Decoder"
description = "A deterministic engineering decoder for Siemens SION 3AE5 vacuum circuit-breaker MLFB/article numbers and Z/additional order codes, with catalog traceability, validation, and technical report export."
version = "1.0.0"
id = "artifacts/sion-mlfb-decoder"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22440

[services.development]
run = "pnpm --filter @workspace/sion-mlfb-decoder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sion-mlfb-decoder", "run", "build" ]
serve = "static"
publicDir = "artifacts/sion-mlfb-decoder/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22440"
BASE_PATH = "/"
